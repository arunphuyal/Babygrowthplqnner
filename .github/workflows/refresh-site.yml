name: Refresh website (guides, sitemap, feed)

# Guides live in the database, but the public pages are prerendered static files. This rebuilds them from the live API every night
# (and on demand) so new or edited guides reach search engines without a developer step. It always saves web.zip as a downloadable
# artifact; it uploads to cPanel over SSH only if the optional secrets below are set.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.API_URL != '' && vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      HAS_SSH: ${{ secrets.CPANEL_SSH_KEY != '' && secrets.CPANEL_HOST != '' && secrets.CPANEL_USER != '' && secrets.CPANEL_KNOWN_HOSTS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build (prerenders every guide from the live API)
        working-directory: web
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_API_URL: ${{ vars.API_URL }}
          PRERENDER_API_URL: ${{ vars.API_URL }}
          VITE_SITE_NAME: ${{ vars.SITE_NAME || 'Babybunu' }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          VITE_GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID }}
          VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      - name: Refuse to publish a site with no guides
        run: |
          count=$(grep -c "<url>" web/dist/sitemap.xml)
          echo "sitemap has $count URLs"
          [ "$count" -gt 3 ] || { echo "No guides were prerendered (is the API reachable?)"; exit 1; }
      - name: Package
        run: cd web/dist && zip -qr ../../web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.zip
          retention-days: 7
      - name: Upload to cPanel over SSH (optional)
        if: env.HAS_SSH == 'true'
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_PATH: ${{ vars.CPANEL_PATH || 'public_html' }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # No --delete: cPanel keeps .well-known (AutoSSL) and cgi-bin in the same folder. Old hashed assets are harmless.
          rsync -az --exclude '.well-known' --exclude 'cgi-bin' \
            -e "ssh -i $HOME/.ssh/id_deploy -p ${CPANEL_PORT:-22} -o IdentitiesOnly=yes" \
            web/dist/ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_PATH/"
